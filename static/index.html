<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Modbus Scanner</h1>
            <p>Encontre dispositivos Modbus na sua rede local.</p>
        </header>

        <main>
            <div class="controls">
                <button id="scanBtn" class="btn primary">
                    <span class="icon">🔍</span>
                    <span class="text">Buscar na Rede</span>
                </button>
            </div>

            <div class="scanner-visuals" id="scannerVisuals" style="display: none;">
                <div class="progress-container" style="width: 100%; max-width: 400px; margin: 20px auto; background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155;">
                    <div id="progressBar" style="width: 0%; height: 20px; background: linear-gradient(90deg, #3b82f6, #60a5fa); transition: width 0.3s ease;"></div>
                </div>
                <p class="status-text" id="statusText">Iniciando varredura...</p>
                <div class="radar" style="margin-top: 10px; transform: scale(0.5);">
                    <div class="sweep"></div>
                </div>
            </div>

            <div class="results" id="resultsContainer" style="display: none;">
                <h2>Dispositivos Encontrados</h2>
                <div class="info-bar" id="infoBar"></div>
                <ul class="device-list" id="deviceList">
                    <!-- Dispositivos serao inseridos aqui -->
                </ul>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
